<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center align-items-center vh-100">
      <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h4 class="card-title text-center mb-4">Sign In</h4>
            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input id="email" type="email" class="form-control" required>
                <div class="invalid-feedback">Please enter a valid email address.</div>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input id="password" type="password" class="form-control" minlength="6" required>
                <div class="invalid-feedback">Password must be at least 6 characters.</div>
              </div>
              <div class="d-grid">
                <button class="btn btn-primary" type="submit">Log in</button>
              </div>
            </form>
            <div id="alertPlaceholder" class="mt-3"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const form = document.getElementById('loginForm');
      const email = document.getElementById('email');
      const password = document.getElementById('password');
      const alertPlaceholder = document.getElementById('alertPlaceholder');

      function showAlert(message, type) {
        alertPlaceholder.innerHTML = '<div class="alert alert-' + type + '">' + message + '</div>';
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        alertPlaceholder.innerHTML = '';
        let valid = true;
        const emailVal = email.value.trim();
        const pwdVal = password.value;

        const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRe.test(emailVal)) {
          email.classList.add('is-invalid');
          valid = false;
        } else {
          email.classList.remove('is-invalid');
          email.classList.add('is-valid');
        }

        if (pwdVal.length < 6) {
          password.classList.add('is-invalid');
          valid = false;
        } else {
          password.classList.remove('is-invalid');
          password.classList.add('is-valid');
        }

        if (valid) {
          showAlert('Validation passed — ready to submit.', 'success');
          // Place your form submission logic here (fetch/XHR).
        } else {
          showAlert('Please fix the errors and try again.', 'danger');
        }
      });

      [email, password].forEach(el => {
        el.addEventListener('input', () => {
          el.classList.remove('is-valid', 'is-invalid');
          alertPlaceholder.innerHTML = '';
        });
      });
    })();
  </script>
</body>
</html>
